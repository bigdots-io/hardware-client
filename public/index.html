<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bigdots</title>
    <style></style>
  </head>
  <body>
    <h1>Winnie's Moon Clock</h1>
    <h3>Currently showing:</h3>
    <img id="preview" src="/preview" width="100" />
    <div id="slot_message"></div>
    <br />
    <button id="nap">Nap</button>
    <button id="timeout">Timeout</button>
    <script>
      document.querySelector("#nap").addEventListener("click", async (ev) => {
        await fetch("/nap", { method: "POST" });
        setTimeout(() => window.location.reload(), 100);
      });

      document
        .querySelector("#timeout")
        .addEventListener("click", async (ev) => {
          alert("todo!");
        });

      (async () => {
        const slotResponse = await fetch("/active_slot").then((response) =>
          response.json()
        );
        document.querySelector("#slot_message").textContent =
          slotResponse.message;
      })();

      function reloadImage() {
        const img = document.getElementById("preview");
        const timestamp = new Date().getTime();
        img.src = `/preview?t=${timestamp}`;
      }

      setInterval(reloadImage, 5000);
    </script>
  </body>
</html>
