<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bigdots</title>
    <style></style>
  </head>
  <body>
    <img id="preview" src="/preview" width="100" />
    <div id="slot_message"></div>
    <br />
    <button id="nap">Nap Mode</button>

    <pre id="override_slot" style="font-size: 11px"></pre>
    <pre id="scheduled_slots" style="font-size: 11px"></pre>
    <script>
      document.querySelector("#nap").addEventListener("click", async (ev) => {
        ev.preventDefault();
        await fetch("/nap", { method: "POST" });
      });

      (async () => {
        const slotResponse = await fetch("/active_slot").then((response) =>
          response.json()
        );
        const scheduledSlots = await fetch("/scheduled_slots").then(
          (response) => response.json()
        );
        document.querySelector("#slot_message").textContent =
          slotResponse.message;
      })();

      function reloadImage() {
        const img = document.getElementById("preview");
        const timestamp = new Date().getTime();
        img.src = `/preview?t=${timestamp}`;
      }

      setInterval(reloadImage, 5000);
    </script>
  </body>
</html>
